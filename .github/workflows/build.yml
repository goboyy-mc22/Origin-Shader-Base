name: Build

on:
  workflow_dispatch:
    inputs:
      platform:
        description: Target platform
        required: true
        default: Multi-platform
        type: choice
        options:
          - Android
          - iOS
          - Windows
          - Multi-platform
          - All
      subversion:
        description: Patch version number, e.g. 5 builds v0.1.5 (empty = use pack_config.toml)
        required: false
        default: ""
        type: string
      release:
        description: Also create a draft GitHub release with the .mcpack files attached
        required: false
        default: false
        type: boolean

permissions:
  contents: read

jobs:
  plan:
    name: Plan
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.select.outputs.matrix }}
    steps:
      - id: select
        env:
          PLATFORM: ${{ inputs.platform }}
        run: |
          # Direct3D shaders (Windows, Multi-platform) can only be compiled on a Windows runner.
          android='{"profile":"android","os":"ubuntu-latest"}'
          ios='{"profile":"ios","os":"ubuntu-latest"}'
          windows='{"profile":"windows","os":"windows-2022"}'
          multiplatform='{"profile":"multiplatform","os":"windows-2022"}'
          case "$PLATFORM" in
            Android)        include="$android" ;;
            iOS)            include="$ios" ;;
            Windows)        include="$windows" ;;
            Multi-platform) include="$multiplatform" ;;
            All)            include="$android,$ios,$windows,$multiplatform" ;;
            *) echo "Unknown platform: $PLATFORM" >&2; exit 1 ;;
          esac
          echo "matrix={\"include\":[$include]}" >> "$GITHUB_OUTPUT"

  build:
    name: Build ${{ matrix.profile }}
    needs: plan
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - uses: actions/cache@v4
        with:
          path: tools/data
          key: tools-data-${{ runner.os }}-${{ hashFiles('tools/util.py') }}

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Setup build tools
        run: python tools setup

      - name: Build pack
        env:
          SUBVERSION: ${{ inputs.subversion }}
        run: |
          args=""
          if [ -n "$SUBVERSION" ]; then args="-v $SUBVERSION"; fi
          python tools pack -p "${{ matrix.profile }}" --strict $args

      - uses: actions/upload-artifact@v4
        with:
          name: origin-shader-base-${{ matrix.profile }}
          path: build/*.mcpack
          if-no-files-found: error

  release:
    name: Draft release
    needs: build
    if: ${{ inputs.release }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          pattern: origin-shader-base-*
          path: packs
          merge-multiple: true

      - name: Create draft release
        env:
          GH_TOKEN: ${{ github.token }}
          SUBVERSION: ${{ inputs.subversion }}
        run: |
          version=$(python3 - <<'PY'
          import os, tomllib
          with open("source/Origin/pack_config.toml", "rb") as f:
              version = tomllib.load(f)["version"]
          if os.environ.get("SUBVERSION"):
              version[2] = int(os.environ["SUBVERSION"])
          print(".".join(str(v) for v in version))
          PY
          )
          ls -l packs
          gh release create "v$version" packs/*.mcpack \
            --draft \
            --target "$GITHUB_SHA" \
            --title "Origin Shader Base v$version" \
            --notes "Origin Shader Base v$version. Pick the .mcpack for your platform (android, ios, windows) or use multiplatform for all of them."
