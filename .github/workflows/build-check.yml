name: Build Check

# Verifies that every material (default and every subpack) compiles for all platforms
# (Android, iOS and Windows) through the multi-platform profile.
# Nothing is packaged or uploaded.

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    name: Compile all platforms
    runs-on: windows-2022
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - uses: actions/cache@v4
        with:
          path: tools/data
          key: tools-data-${{ runner.os }}-${{ hashFiles('tools/util.py') }}

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Setup build tools
        run: python tools setup

      - name: Compile pack (default and all subpacks)
        run: python tools pack -p multiplatform --no-zip --strict
