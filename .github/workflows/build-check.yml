name: Build Check

# Verifies that every material compiles for all platforms (Android, iOS and Windows),
# once with the default options and once with every optional effect enabled.
# Nothing is packaged or uploaded.

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    name: Compile all platforms
    runs-on: windows-2022
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - uses: actions/cache@v4
        with:
          path: tools/data
          key: tools-data-${{ runner.os }}-${{ hashFiles('tools/util.py') }}

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Setup build tools
        run: python tools setup

      - name: Compile materials
        run: python tools mats -p multiplatform --strict

      - name: Compile materials with all effects enabled
        run: python tools mats -p multiplatform --strict -s ORIGIN_ENABLE_WATER_WAVES ORIGIN_ENABLE_LEAF_SWAY
